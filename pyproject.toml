[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "right-to-dissent"
version = "0.1.0"
description = "Reproducible pilot for protected dissent in LLM teams"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dissent = "dissent.cli:main"

[tool.setuptools.packages.find]
include = ["dissent*"]
